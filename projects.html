<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Jonte Jesper Willert</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050505;
color:#eaeaea;
font-family:Inter,sans-serif;
overflow-x:hidden;
}

/* grain */
body::before{
content:"";
position:fixed;
inset:0;
background-image:radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px);
background-size:4px 4px;
opacity:.03;
pointer-events:none;
z-index:9999;
}

/* nav */
.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:rgba(0,0,0,.55);
backdrop-filter:blur(12px);
z-index:100;
}

.nav a{
color:#aaa;
text-decoration:none;
font-size:11px;
letter-spacing:.25em;
}
.nav a:hover{color:#fff}

/* hero */
.hero{
height:60vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle at center,#141414 0%,#000 75%);
}

.hero-title{
display:flex;
flex-direction:column;
line-height:.9;
}

.hero-title span{
font-size:clamp(3.5rem,10vw,8rem);
font-weight:200;
letter-spacing:.18em;
opacity:0;
animation:fadeUp 1.2s ease forwards;
}

.hero-title span:last-child{animation-delay:.2s;}

.hero p{
opacity:.5;
letter-spacing:.3em;
margin-top:20px;
font-size:12px;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(40px)}
to{opacity:1;transform:translateY(0)}
}

/* content */
.content{
max-width:1200px;
margin:auto;
padding:60px 24px;
}

/* project cards */
.project{
position:relative;
margin-bottom:140px;
height:420px;
display:flex;
align-items:flex-end;
overflow:hidden;
border-radius:8px;
cursor:pointer;
text-decoration:none;
}

/* background image layer */
.project-bg{
position:absolute;
inset:0;
display:grid;
grid-template-columns:1fr 1fr;
gap:0;
}

.project-bg img{
width:100%;
height:100%;
object-fit:cover;
opacity:0.22;
filter:brightness(.7) contrast(1.1);
transform:scale(1.05);
transition:transform 1s ease, opacity 1s ease;
}

.project:hover .project-bg img{
opacity:0.35;
transform:scale(1.08);
}

/* dark overlay */
.project::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.2));
}

/* text */
.project-info{
position:relative;
z-index:2;
padding:40px;
}

.project-title{
font-size:34px;
letter-spacing:.12em;
margin:0;
color:#fff;
}

.project-meta{
font-size:11px;
letter-spacing:.25em;
color:#aaa;
margin-top:10px;
}

.project-link{
display:inline-block;
margin-top:18px;
font-size:11px;
letter-spacing:.3em;
color:#fff;
opacity:.7;
}

.project-link:hover{opacity:1}

</style>
</head>

<body>

<div class="nav">
<a href="index.html">HOME</a>
<a href="about.html">ABOUT</a>
<a href="projects.html">PROJECTS</a>
<a href="cv.html">CV</a>
<a href="contact.html">CONTACT</a>
</div>

<section class="hero">
<div class="hero-title">
<span>PROJECTS</span>
<span>ARCHIVE</span>
</div>
<p>SELECTED FILM WORKS</p>
</section>

<div class="content">

<!-- BERRY TEA (CLICKABLE FIXED) -->

<div class="project-bg">
<img src="berrytea10.png">
<img src="berrytea5.png">
</div>

<div class="project-info">
<h2 class="project-title">Berry Tea</h2>
<div class="project-meta">SCI-FI / CINEMATOGRAPHY STUDY · 12:21</div>
<div class="project-link">OPEN PROJECT →</div>
</div>

</a>

<div class="project-meta">SHORT FILM / WORK IN PROGRESS</div>

</div>

</div>

</body>
</html>
